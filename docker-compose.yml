name: freshness

x-app: &app
  # Built once by the api service; the others reuse the same local image.
  image: freshness:latest
  pull_policy: never
  restart: unless-stopped
  stop_grace_period: 15s
  environment: &app-env
    DATABASE_URL: postgresql://freshness:freshness@postgres:5432/freshness
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: document-changes
    KAFKA_DLQ_TOPIC: document-changes.dlq
    KAFKA_CONSUMER_GROUP: indexer
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    MAX_RETRIES: ${MAX_RETRIES:-5}
    RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-0.5}
    RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-60}
    RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-200}
    METRICS_PORT: 9100
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=3)
    interval: 5s
    timeout: 5s
    retries: 20

services:
  api:
    <<: *app
    build: .
    command:
      - uvicorn
      - --factory
      - freshness.api.app:create_app
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20

  relay:
    <<: *app
    command: ["python", "-m", "freshness.relay"]

  indexer:
    <<: *app
    command: ["python", "-m", "freshness.indexer"]
    environment:
      <<: *app-env
      # Only the indexer embeds documents, so chaos runs inject failures here.
      EMBEDDING_FAILURE_RATE: ${EMBEDDING_FAILURE_RATE:-0}
    deploy:
      replicas: 2

  reconciler:
    <<: *app
    command: ["python", "-m", "freshness.reconciler"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: freshness
      POSTGRES_PASSWORD: freshness
      POSTGRES_DB: freshness
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshness -d freshness"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for other containers, EXTERNAL for clients on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init with the right partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in document-changes document-changes.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 6 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape services started on the host (`make api`, ...).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Read-only anonymous access so the dashboard opens without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/freshness.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
