global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Services running inside docker compose. DNS discovery picks up every
  # indexer replica without listing them by hand.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: relay
    dns_sd_configs:
      - names: ["relay"]
        type: A
        port: 9100
  - job_name: indexer
    dns_sd_configs:
      - names: ["indexer"]
        type: A
        port: 9100
  - job_name: reconciler
    dns_sd_configs:
      - names: ["reconciler"]
        type: A
        port: 9100

  # Services started on the host with `make api`, `make relay`, etc.
  - job_name: local
    static_configs:
      - targets:
          - host.docker.internal:8000
          - host.docker.internal:9101
          - host.docker.internal:9102
          - host.docker.internal:9103
